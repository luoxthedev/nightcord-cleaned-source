name: Release Stable
on:
    push:
        tags:
            - "v*"

env:
    FORCE_COLOR: true

permissions:
    contents: write

jobs:
    Release:
        name: Build & Release ${{ github.ref_name }}
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v3

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build standalone
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Create nightcord-dist.zip
              run: |
                  cd dist
                  mkdir -p package/dist/desktop
                  mkdir -p package/browser

                  # Desktop files
                  cp desktop/patcher.js package/dist/desktop/
                  cp desktop/patcher.js.LEGAL.txt package/dist/desktop/
                  cp desktop/renderer.js package/dist/desktop/
                  cp desktop/renderer.css package/dist/desktop/
                  cp desktop/renderer.js.LEGAL.txt package/dist/desktop/
                  cp nightcord/preload.js package/dist/desktop/preload.js

                  # Browser extension
                  cp browser/browser.js package/browser/
                  cp browser/browser.css package/browser/
                  cp browser/browser.js.LEGAL.txt package/browser/
                  cp extension-chrome.zip package/browser/ 2>/dev/null || true
                  cp extension-firefox.zip package/browser/ 2>/dev/null || true

                  # Plugin lists
                  cp plugins.json package/ 2>/dev/null || true
                  cp equicordplugins.json package/ 2>/dev/null || true
                  cp vencordplugins.json package/ 2>/dev/null || true
                  cp devs.json package/ 2>/dev/null || true

                  cd package
                  zip -r ../nightcord-dist.zip .

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"
                  gh release create "$TAG" --target main --title "Nightcord $TAG" --generate-notes nightcord-dist.zip
