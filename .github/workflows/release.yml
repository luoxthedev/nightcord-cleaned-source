name: Release Stable
on:
    push:
        tags:
            - "v*"

env:
    FORCE_COLOR: true

permissions:
    contents: write

jobs:
    Release:
        name: Build & Release ${{ github.ref_name }}
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v3

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build standalone
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Collect release files
              run: |
                  cd dist
                  mkdir release

                  if [ -f browser/browser.js ]; then
                    cp browser/browser.* release/
                  fi

                  cp *.{json,zip,asar} release/ 2>/dev/null || true

                  if [ -d desktop ]; then
                    cp desktop/* release/
                  fi

                  find release -size 0 -delete
                  rm -f release/package.json
                  rm -f release/*.map

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"
                  gh release create "$TAG" --target main --title "Nightcord $TAG" --generate-notes dist/release/*
