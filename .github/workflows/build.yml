name: Release Nightcord
on:
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to create or update.
                required: true
                default: nightly
            prerelease:
                description: Mark the release as a prerelease.
                required: true
                type: boolean
                default: true

env:
    FORCE_COLOR: true

permissions:
    contents: write

jobs:
    Build:
        name: Build Nightcord
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Create installer payload
              run: |
                  mkdir -p package/dist/desktop
                  mkdir -p package/browser

                  cp dist/desktop/patcher.js package/dist/desktop/
                  cp dist/desktop/patcher.js.LEGAL.txt package/dist/desktop/
                  cp dist/desktop/renderer.js package/dist/desktop/
                  cp dist/desktop/renderer.css package/dist/desktop/
                  cp dist/desktop/renderer.js.LEGAL.txt package/dist/desktop/
                  cp dist/nightcord/preload.js package/dist/desktop/preload.js

                  cp nightcord-index.js package/
                  cp nightcord-preload.js package/

                  cp dist/browser/browser.js package/browser/
                  cp dist/browser/browser.css package/browser/
                  cp dist/browser/browser.js.LEGAL.txt package/browser/
                  cp dist/extension-chrome.zip package/browser/ 2>/dev/null || true
                  cp dist/extension-firefox.zip package/browser/ 2>/dev/null || true

                  cp dist/plugins.json package/ 2>/dev/null || true
                  cp dist/equicordplugins.json package/ 2>/dev/null || true
                  cp dist/vencordplugins.json package/ 2>/dev/null || true
                  cp dist/devs.json package/ 2>/dev/null || true

                  cd package
                  zip -r ../nightcord-payload.zip .

            - name: Embed payload in installer
              run: |
                  python3 - <<'PY'
                  import base64
                  import shutil
                  import textwrap
                  from pathlib import Path

                  assets = Path("release-assets")
                  assets.mkdir(exist_ok=True)

                  payload = base64.b64encode(Path("nightcord-payload.zip").read_bytes()).decode()
                  payload = "\n".join(textwrap.wrap(payload, 76))
                  installer = Path("nightcord-install.ps1").read_text(encoding="utf-8")
                  installer = installer.replace("__NIGHTCORD_PAYLOAD_BASE64__", payload)
                  Path("release-assets/nightcord-install.ps1").write_text(installer, encoding="utf-8", newline="\r\n")

                  for name in ("nightcord-install.bat", "nightcord-uninstall.bat", "nightcord-uninstall.ps1"):
                      shutil.copyfile(name, assets / name)
                  PY

            - name: Upload Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${{ inputs.tag }}"
                  PRERELEASE="${{ inputs.prerelease }}"

                  args=("$TAG" --target "$GITHUB_SHA" --title "Nightcord $TAG" --generate-notes)
                  if [ "$PRERELEASE" = "true" ]; then
                    args+=(--prerelease)
                  fi

                  zip -j nightcord-install.zip release-assets/nightcord-install.bat release-assets/nightcord-install.ps1
                  zip -j nightcord-uninstall.zip release-assets/nightcord-uninstall.bat release-assets/nightcord-uninstall.ps1
                  mkdir -p nightcord-extension/chrome nightcord-extension/firefox
                  cp -r dist/browser/chromium-unpacked/* nightcord-extension/chrome/
                  cp -r dist/browser/firefox-unpacked/* nightcord-extension/firefox/
                  zip -r nightcord-extension.zip nightcord-extension

                  gh release create "${args[@]}" 2>/dev/null || true
                  gh release upload "$TAG" --clobber \
                    nightcord-install.zip \
                    nightcord-uninstall.zip \
                    nightcord-extension.zip
